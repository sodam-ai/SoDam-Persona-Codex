name: validate

# SoDam-Persona 정합성 검사 — push/PR마다 validate.mjs 자동 실행.
# 관점 수 드리프트·스킬 수 불일치·도메인 배선 누락·JSON 오류가 main에 못 올라오게 차단.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: 정합성 검사 (node validate.mjs)
        run: node validate.mjs

      - name: 훅·검증기·한국어 입력 회귀 검사
        run: node --test test-hooks.mjs test-validator.mjs test-supplemental.mjs test-diagnose.mjs test-evaluate.mjs test-docs.mjs

      - name: Install document checker prerequisite
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/pandoc.deb" https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-1-amd64.deb
          echo "4db8bad3d9f8451a3d52171664f3c58b08af6450fbd54a28dd05f6b00b0bbb04  $RUNNER_TEMP/pandoc.deb" | sha256sum --check --strict
          sudo dpkg --install "$RUNNER_TEMP/pandoc.deb"
          pandoc --version
      - name: Verify Markdown and HTML content synchronization
        run: node check-docs.mjs
