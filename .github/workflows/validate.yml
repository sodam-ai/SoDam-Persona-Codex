name: validate

# SoDam-Persona 정합성 검사 — push/PR마다 validate.mjs 자동 실행.
# 관점 수 드리프트·스킬 수 불일치·도메인 배선 누락·JSON 오류가 main에 못 올라오게 차단.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: 정합성 검사 (node validate.mjs)
        run: node validate.mjs

      - name: 훅·검증기·한국어 입력 회귀 검사
        run: node --test test-hooks.mjs test-validator.mjs test-supplemental.mjs
