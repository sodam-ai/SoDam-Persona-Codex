<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --fg:#1f2328; --bg:#ffffff; --muted:#59636e; --border:#d1d9e0; --code-bg:#f6f8fa; --link:#0969da; }
  @media (prefers-color-scheme: dark){ :root{ --fg:#e6edf3; --bg:#0d1117; --muted:#9198a1; --border:#3d444d; --code-bg:#161b22; --link:#4493f8; } }
  * { box-sizing: border-box; }
  html { background:var(--bg); }
  body { margin:0; max-width:none; padding:2rem 1rem 4rem; color:var(--fg); background:var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.7; font-size:16px; -webkit-text-size-adjust:100%; }
  body > * { max-width: 900px; margin-left:auto; margin-right:auto; }
  h1,h2,h3 { line-height:1.3; margin-top:1.8em; }
  h1 { font-size:2rem; border-bottom:2px solid var(--border); padding-bottom:.3em; }
  h2 { font-size:1.5rem; border-bottom:1px solid var(--border); padding-bottom:.3em; }
  h3 { font-size:1.2rem; }
  a { color:var(--link); text-decoration:none; }
  a:hover { text-decoration:underline; }
  code { background:var(--code-bg); padding:.2em .4em; border-radius:6px; font-size:.88em;
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; }
  pre { background:var(--code-bg); padding:1rem; border-radius:8px; overflow-x:auto; border:1px solid var(--border); }
  pre code { background:none; padding:0; }
  table { border-collapse:collapse; width:100%; display:block; overflow-x:auto; margin:1em 0; }
  th,td { border:1px solid var(--border); padding:.5em .8em; text-align:left; }
  th { background:var(--code-bg); }
  blockquote { margin:1em 0; padding:.4em 1em; border-left:4px solid var(--border); color:var(--muted); background:var(--code-bg); border-radius:0 6px 6px 0; }
  details { background:var(--code-bg); border:1px solid var(--border); border-radius:8px; padding:.6em 1em; margin:1em 0; }
  summary { cursor:pointer; font-weight:600; }
  hr { border:none; border-top:1px solid var(--border); margin:2em 0; }
  img { max-width:100%; }
  @media (max-width:600px){ body{ padding:1rem .8rem 3rem; font-size:15px; } h1{font-size:1.6rem;} h2{font-size:1.3rem;} }
</style>
